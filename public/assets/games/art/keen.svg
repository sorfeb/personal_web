<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="A small rocket parked on Martian dunes under two moons">
  <defs>
    <linearGradient id="keenSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d0f3a"/>
      <stop offset="30%" stop-color="#43185a"/>
      <stop offset="58%" stop-color="#8b2f55"/>
      <stop offset="80%" stop-color="#cf5a34"/>
      <stop offset="100%" stop-color="#f2913f"/>
    </linearGradient>
    <linearGradient id="keenMesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a2f36"/>
      <stop offset="100%" stop-color="#5a2029"/>
    </linearGradient>
    <linearGradient id="keenDuneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d46a33"/>
      <stop offset="100%" stop-color="#a94a26"/>
    </linearGradient>
    <linearGradient id="keenDuneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5431f"/>
      <stop offset="100%" stop-color="#712c17"/>
    </linearGradient>
    <linearGradient id="keenDuneC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d2715"/>
      <stop offset="100%" stop-color="#41160d"/>
    </linearGradient>
    <linearGradient id="keenHull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fa4b8"/>
      <stop offset="38%" stop-color="#eef4f8"/>
      <stop offset="72%" stop-color="#c3d1de"/>
      <stop offset="100%" stop-color="#6c7f92"/>
    </linearGradient>
    <radialGradient id="keenMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe0f0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffe0f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#keenSky)"/>

  <g fill="#ffe9f6">
    <circle cx="86" cy="72" r="2.4" opacity="0.85"/>
    <circle cx="196" cy="146" r="1.6" opacity="0.55"/>
    <circle cx="308" cy="58" r="2" opacity="0.7"/>
    <circle cx="418" cy="128" r="1.5" opacity="0.5"/>
    <circle cx="612" cy="66" r="2.2" opacity="0.78"/>
    <circle cx="726" cy="136" r="1.6" opacity="0.52"/>
    <circle cx="884" cy="60" r="1.9" opacity="0.66"/>
    <circle cx="952" cy="176" r="1.5" opacity="0.46"/>
    <circle cx="512" cy="188" r="1.4" opacity="0.42"/>
    <circle cx="146" cy="222" r="1.6" opacity="0.48"/>
  </g>

  <!-- Phobos and Deimos: two moons is the cheapest possible "not Earth" signal. -->
  <circle cx="812" cy="168" r="120" fill="url(#keenMoonGlow)"/>
  <circle cx="812" cy="168" r="52" fill="#f6dce8"/>
  <g fill="#d3aec2" opacity="0.55">
    <circle cx="796" cy="154" r="11"/>
    <circle cx="828" cy="184" r="7"/>
  </g>
  <circle cx="642" cy="112" r="22" fill="#e9c9dc" opacity="0.8"/>
  <circle cx="636" cy="106" r="6" fill="#c9a2ba" opacity="0.5"/>

  <!-- Distant mesas -->
  <path d="M0 470 L64 470 L92 428 L188 428 L214 470 L318 470 L348 414 L436 414 L462 470 L604 470 L632 436 L716 436 L742 470 L864 470 L892 424 L964 424 L988 470 L1000 470 L1000 800 L0 800 Z" fill="url(#keenMesa)"/>

  <!-- Dune bands, back to front -->
  <path d="M0 530 Q160 486 328 522 Q502 560 672 514 Q838 470 1000 512 L1000 800 L0 800 Z" fill="url(#keenDuneA)"/>
  <path d="M0 612 Q186 566 372 604 Q560 642 742 596 Q878 562 1000 592 L1000 800 L0 800 Z" fill="url(#keenDuneB)"/>

  <!-- Rocket, standing on the second dune. Large enough to read as the subject
       at the ~400px the card actually renders at. -->
  <g transform="translate(300 424) scale(1.75)">
    <!-- fins behind the hull -->
    <path d="M-30 118 L-8 60 L-8 122 Z" fill="#b23a2a"/>
    <path d="M30 118 L8 60 L8 122 Z" fill="#8e2c20"/>
    <!-- hull -->
    <path d="M0 -34 C22 -6 30 40 30 84 C30 108 22 122 0 122 C-22 122 -30 108 -30 84 C-30 40 -22 -6 0 -34 Z" fill="url(#keenHull)"/>
    <!-- nose cone -->
    <path d="M0 -34 C10 -22 16 -6 19 8 L-19 8 C-16 -6 -10 -22 0 -34 Z" fill="#d94f2e"/>
    <!-- porthole -->
    <circle cx="0" cy="46" r="13" fill="#123a52"/>
    <circle cx="0" cy="46" r="13" fill="none" stroke="#9fb3c4" stroke-width="4"/>
    <circle cx="-4" cy="41" r="4" fill="#6fd0f0" opacity="0.8"/>
    <!-- landing struts -->
    <path d="M-22 118 L-38 140 M22 118 L38 140" stroke="#7d8fa0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Foreground dune, darkest, anchors the composition and takes the scrim. -->
  <path d="M0 690 Q210 644 424 684 Q640 724 830 678 Q930 654 1000 672 L1000 800 L0 800 Z" fill="url(#keenDuneC)"/>

  <!-- Scattered rocks -->
  <g fill="#3a1209" opacity="0.85">
    <ellipse cx="742" cy="700" rx="34" ry="13"/>
    <ellipse cx="196" cy="716" rx="24" ry="10"/>
    <ellipse cx="560" cy="726" rx="18" ry="8"/>
  </g>
</svg>
