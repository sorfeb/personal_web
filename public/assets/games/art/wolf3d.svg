<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="A fortress keep silhouetted against a moonlit winter sky">
  <defs>
    <linearGradient id="wolfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070f"/>
      <stop offset="38%" stop-color="#0d1730"/>
      <stop offset="70%" stop-color="#1e2f52"/>
      <stop offset="100%" stop-color="#33486e"/>
    </linearGradient>
    <radialGradient id="wolfMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dce8ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#8fa8d8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#33486e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wolfMoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3d3f0"/>
    </linearGradient>
    <linearGradient id="wolfRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#101a2c"/>
    </linearGradient>
    <linearGradient id="wolfKeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#wolfSky)"/>

  <g fill="#dbe6ff">
    <circle cx="118" cy="96" r="2.2" opacity="0.8"/>
    <circle cx="232" cy="168" r="1.6" opacity="0.55"/>
    <circle cx="344" cy="72" r="2" opacity="0.7"/>
    <circle cx="452" cy="150" r="1.4" opacity="0.45"/>
    <circle cx="566" cy="88" r="1.8" opacity="0.62"/>
    <circle cx="676" cy="164" r="1.5" opacity="0.5"/>
    <circle cx="884" cy="118" r="2.1" opacity="0.72"/>
    <circle cx="948" cy="232" r="1.5" opacity="0.48"/>
    <circle cx="60" cy="238" r="1.7" opacity="0.5"/>
    <circle cx="792" cy="46" r="1.5" opacity="0.55"/>
  </g>

  <!-- Held clear of the right tower's pennant (x≤748): a dark flag crossing the
       disc reads as a rendering fault, not as a flag. -->
  <circle cx="842" cy="162" r="230" fill="url(#wolfMoonGlow)"/>
  <circle cx="842" cy="162" r="76" fill="url(#wolfMoon)"/>
  <!-- Craters: a flat disc reads as a hole punched in the sky. -->
  <g fill="#a8bcdf" opacity="0.5">
    <circle cx="818" cy="142" r="15"/>
    <circle cx="864" cy="180" r="10"/>
    <circle cx="840" cy="116" r="7"/>
  </g>

  <!-- Far ridgeline -->
  <path d="M0 486 L128 424 L236 470 L352 408 L474 462 L588 414 L706 468 L828 420 L940 474 L1000 448 L1000 800 L0 800 Z" fill="url(#wolfRidge)"/>

  <!-- Fortress: two flanking towers, a central keep, a gate arch. Crenellations
       are drawn as one path per element rather than repeated rects — fewer nodes,
       same silhouette at the size this actually renders. -->
  <g fill="url(#wolfKeep)">
    <!-- left tower -->
    <path d="M262 300 L262 288 L280 288 L280 300 L298 300 L298 288 L316 288 L316 300 L334 300 L334 288 L352 288 L352 300 L352 660 L262 660 Z"/>
    <!-- right tower -->
    <path d="M666 300 L666 288 L684 288 L684 300 L702 300 L702 288 L720 288 L720 300 L738 300 L738 288 L756 288 L756 300 L756 660 L666 660 Z"/>
    <!-- central keep -->
    <path d="M420 366 L420 352 L442 352 L442 366 L464 366 L464 352 L486 352 L486 366 L508 366 L508 352 L530 352 L530 366 L552 366 L552 352 L574 352 L574 366 L596 366 L596 352 L618 352 L618 366 L618 660 L420 660 Z"/>
    <!-- curtain wall between the towers -->
    <path d="M334 448 L334 436 L352 436 L352 448 L370 448 L370 436 L388 436 L388 448 L406 448 L406 436 L424 436 L424 448 L424 660 L334 660 Z"/>
    <path d="M614 448 L614 436 L632 436 L632 448 L650 448 L650 436 L668 436 L668 448 L686 448 L686 436 L704 436 L704 448 L704 660 L614 660 Z"/>
    <!-- Roof pennants. The pole needs real width — a zero-width line segment in a
         filled path paints nothing, leaving the flag floating. -->
    <path d="M304 292 L304 232 L310 232 L310 292 Z"/>
    <path d="M310 236 L346 250 L310 264 Z"/>
    <path d="M708 292 L708 232 L714 232 L714 292 Z"/>
    <path d="M714 236 L750 250 L714 264 Z"/>
  </g>

  <!-- Gate: a void punched through the keep, arched at the top. -->
  <path d="M478 660 L478 552 A41 41 0 0 1 560 552 L560 660 Z" fill="#02040a"/>

  <!-- Lit windows. Warm against an entirely cool frame, so the eye lands here. -->
  <g fill="#f0c86a">
    <rect x="296" y="392" width="16" height="26" rx="2" opacity="0.9"/>
    <rect x="700" y="392" width="16" height="26" rx="2" opacity="0.75"/>
    <rect x="296" y="482" width="16" height="26" rx="2" opacity="0.6"/>
    <rect x="700" y="500" width="16" height="26" rx="2" opacity="0.85"/>
    <rect x="452" y="424" width="18" height="28" rx="2" opacity="0.8"/>
    <rect x="566" y="424" width="18" height="28" rx="2" opacity="0.55"/>
    <rect x="508" y="418" width="20" height="30" rx="2" opacity="0.95"/>
  </g>

  <!-- Foreground snow bank -->
  <path d="M0 646 L142 618 L288 650 L430 622 L578 654 L722 620 L866 652 L1000 626 L1000 800 L0 800 Z" fill="#0a1120"/>
</svg>
